# KIRA ibm2 memory check: Qwen3-4B-Instruct-2507 on one Quadro RTX 6000 as KIRA's benchmark/rig/serve.sh ran it on ibm2:
# vLLM 0.28.0 (FP16 on Turing, Triton attention), --enforce-eager, prefix caching, block 16, vLLM 0.28's
# defaults for a <70 GiB GPU under `vllm serve` (2048 batched tokens, 256 seqs). Run log section 1: 96,383 GPU KV tokens at max-model-len 65,856, --gpu-memory-utilization 0.9.
kind: Scenario
name: qwen3-4b-instruct-2507-quadro-rtx-6000-memcheck
engine_version: "0.29.0"  # KIRA ran 0.28.0; the kernel knows 0.29.0 and 0.31.0 only

model: qwen3-4b-instruct-2507
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: quadro-rtx-6000
  nodes: 1
  gpus_per_node: 1
---
kind: Deployment
name: qwen3-4b-instruct-2507-quadro-rtx-6000-memcheck

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 1
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      cache_dtype: auto
      block_size: 16
      max_num_batched_tokens: 2048
      max_num_seqs: 256
      max_model_len: 65856
      cudagraph_mode: NONE
      gpu_memory_utilization: 0.90
      enable_prefix_caching: true
