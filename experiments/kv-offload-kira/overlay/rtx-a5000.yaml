_comment: "NVIDIA RTX A5000 (GA102, Ampere workstation, 230 W), KIRA's ibm1 GPU. TFlopsPeak=111.1 is DENSE BF16 tensor (datasheet 222.2 TFLOPS is with sparsity). No FP8 tensor cores on Ampere, so TFlopsFP8=0 as for A100. Source: NVIDIA RTX A5000 datasheet (https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/rtx-a5000/nvidia-rtx-a5000-datasheet.pdf)."
