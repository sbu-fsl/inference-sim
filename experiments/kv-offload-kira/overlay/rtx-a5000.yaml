_comment_interconnect: "IntraNodeBwGBps: PCIe Gen4 x16, ~32 GB/s per direction (vendor_spec). The optional 2-way NVLink bridge (112.5 GB/s bidirectional) is not assumed; KIRA serves on one GPU."
IntraNodeBwGBps: 32
_comment_sm: "SMCount: 64 enabled SMs on GA102 as shipped in RTX A5000 (8,192 CUDA cores / 128 per SM), NVIDIA datasheet."
