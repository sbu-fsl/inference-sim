# Route A (generalization) deployment for the KIRA KV-offload comparison: Qwen2.5-7B-Instruct,
# one L40S (closest catalogued analogue to KIRA's RTX A5000), BF16 weights + KV, TP1.
kind: Scenario
name: qwen2.5-7b-instruct-l40s-bf16-vllm-tp1
engine_version: "0.31.0"

model: qwen2.5-7b-instruct
coefficients: [cost-model-primitives, cost-model-collectives, cost-model-host-overheads, cost-model-attention, cost-model-recurrent, cost-model-memory]

cluster:
  hardware: l40s
  nodes: 1
  gpus_per_node: 1
---
kind: Deployment
name: qwen2.5-7b-instruct-l40s-bf16-vllm-tp1

pools:
  - role: colocated
    nodes: 1
    parallel:
      tp: 1
      pp: 1
      dp: 1
      enable_expert_parallel: false
    engine:
      cache_dtype: auto
      block_size: 16
      max_num_batched_tokens: 8192
      max_num_seqs: 64
      max_model_len: 16704
      cudagraph_mode: PIECEWISE
      gpu_memory_utilization: 0.3517
      enable_prefix_caching: true
